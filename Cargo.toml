[package]
name = "giteagle"
version = "0.1.0"
description = "Desktop Git repository viewer"
license = "MIT"
repository = "https://github.com/diath/giteagle"
keywords = ["git", "viewer", "desktop", "gui", "tauri"]
categories = ["development-tools", "gui"]
edition = "2024"
rust-version = "1.91"
# The published crate carries the built interface, so installing it doesn't
# need Node, and the capability schemas, so tauri-build finds them unchanged
# instead of writing into the package, which cargo publish rejects. Git
# ignores both, so cargo only packages them when they are listed here.
include = [
    "/build.rs",
    "/capabilities",
    "/gen/schemas",
    "/icons",
    "/src",
    "/tauri.conf.json",
    "/ui/dist",
    "/LICENSE",
    "/README.md",
]

[features]
default = ["custom-protocol"]
# Serves the interface built into the binary rather than the dev server, so a
# plain cargo build or cargo install makes a working app. `cargo tauri dev`
# turns it off.
custom-protocol = ["tauri/custom-protocol"]

[lib]
# A distinct library name avoids output file collisions with the binary on Windows.
name = "giteagle_lib"

# Records the backend's responses for the website's screenshots; see
# tools/screenshots/generate.py.
[[example]]
name = "docs_dump"
path = "tools/screenshots/dump.rs"

# Dependencies such as git2 and the vendored libgit2 are slow unoptimized and
# rarely change, so dev builds optimize them once and drop their debug info.
# The app's own code stays quick to rebuild and keeps line tables for
# backtraces.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Full debug info for the app's own code, for stepping through it in a
# debugger: cargo build --profile debugging
[profile.debugging]
inherits = "dev"
debug = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-dialog = "2.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
